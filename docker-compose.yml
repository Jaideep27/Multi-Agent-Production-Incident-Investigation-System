# Phase 1 database. The api and worker services are added in steps 12-13.
services:
  db:
    image: postgres:16
    env_file: .env
    ports:
      - "${IV_PG_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Scripts run once, in file-name order, the first time the volume is created.
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
