# The incident plan: one entry per incident in the dataset (docs/implementation_plan.md §4).
#
# THIS FILE IS PART OF THE ANSWER KEY. Only the generator reads it. Agents, prompts, tools
# and the scorer must never load it or name its plan IDs or archetypes (tests/unit/
# test_leakage.py enforces that for src/).
#
# Each entry = archetype (what breaks, with its parameters) x domain topology, plus seeded
# decoys, noise and tool-failure rules. The seed drives every random choice. Inconclusive
# entries add `insufficiency`: what was never collected (withhold), what a persistent tool
# rule blocks (unreachable), and the plausible wrong answers the visible data supports.
# Noise is applied in list order; a log gap goes last so it also removes warnings inside it.

incidents:
  # ======================================================== crypto_exchange
  - plan_id: CX-1
    domain: crypto_exchange
    archetype: traffic_surge
    seed: 1101
    expected_outcome: identifiable
    params: {component: order-api, surge_factor: 3.8, max_replicas: 4}
    decoys:
      - type: red_herring_change
        params: {service: price-feed-client, minutes_before: [9, 11]}
    noise:
      - type: benign_warnings
      - type: clock_skew
        params: {service: matching-engine, seconds: 45}

  - plan_id: CX-2
    domain: crypto_exchange
    archetype: resource_saturation
    seed: 1102
    expected_outcome: identifiable
    params: {component: wallet-service, mode: memory_oom, limit: 512Mi}
    decoys:
      - type: downstream_symptom
        params: {service: blockchain-node, message: "peer sync lagging 3 blocks behind tip"}
    noise:
      - type: benign_warnings
    tool_failures:
      - tool: query_metrics
        mode: transient
        params: {fail_first_n: 1, status: timeout}

  - plan_id: CX-3
    domain: crypto_exchange
    archetype: cache_degradation
    seed: 1103
    expected_outcome: identifiable
    params: {component: redis-orderbook, mode: restart}
    decoys:
      - type: downstream_symptom
        params: {service: postgres-ledger, level: WARN, metric: cpu_pct, bad_mean: 88.0,
                 message: "slow query 2300ms: SELECT * FROM order_book_snapshot WHERE market = $1"}
    noise:
      - type: benign_warnings
      - type: log_gap

  - plan_id: CX-4
    domain: crypto_exchange
    archetype: lock_contention
    seed: 1104
    expected_outcome: inconclusive
    params: {component: postgres-ledger, table: ledger_entries, cause: long_transaction}
    decoys:
      - type: red_herring_change
        params: {service: matching-engine}
    noise:
      - type: benign_warnings
      - type: conflicting_sources
        params: {service: postgres-ledger, metric: cpu_pct, factor: 0.55}
    tool_failures:
      - tool: get_change_history
        mode: persistent
        params: {status: error, when: {include_diff: true}}
    insufficiency:
      reason: >-
        Lock-wait logs and lock metrics were never collected, and the diff of the
        matching-engine deploy that would rule it out cannot be fetched.
      withhold: [logs, metric]
      alternatives:
        - {category: bad_deploy, component: matching-engine,
           why_plausible: "a deploy minutes before ledger writes slowed; its diff is unavailable"}

  - plan_id: CX-5
    domain: crypto_exchange
    archetype: upstream_vendor_failure
    seed: 1105
    expected_outcome: identifiable
    params: {component: price-feed-client, vendor: market-data-vendor, status: 502}
    decoys:
      - type: unrelated_spike
        params: {service: matching-engine, metric: cpu_pct, bad_mean: 91.0}
    noise:
      - type: benign_warnings
    tool_failures:
      - tool: query_logs
        mode: partial
        params: {keep_fraction: 0.7}

  # ======================================================== payment_gateway
  - plan_id: PG-1
    domain: payment_gateway
    archetype: pool_size_regression
    seed: 1001
    expected_outcome: identifiable
