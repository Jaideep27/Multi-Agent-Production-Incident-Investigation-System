      to_value: 20
    decoys:
      - type: red_herring_change
        params:
          service: notification-service
      - type: lookalike_history
        params:
          title: UPI failures during partner bank outage
          category: dependency_failure
          component: bank-adapter
          resolution: failed over to the secondary bank
    noise:
      - type: benign_warnings
      - type: log_gap
    tool_failures:
      - tool: query_logs
        mode: transient
        params:
          fail_first_n: 1
          status: timeout

  - plan_id: PG-2
    domain: payment_gateway
    archetype: lb_misbalance
    seed: 1002
    expected_outcome: identifiable
    params: {component: edge-lb, backend: payment-api, mode: weight_skew}
    decoys:
      - type: unrelated_spike
        params: {service: bank-adapter, metric: p99_latency_ms, bad_mean: 1450.0}
    noise:
      - type: benign_warnings

  - plan_id: PG-3
    domain: payment_gateway
    archetype: cache_degradation
    seed: 1003
    expected_outcome: identifiable
    params: {component: redis-idempotency, mode: eviction_policy}
    decoys:
      - type: downstream_symptom
        params: {service: postgres-payments, metric: cpu_pct, bad_mean: 79.0,
                 message: "slow query 1800ms: INSERT INTO payment_attempts ... ON CONFLICT DO NOTHING"}
      - type: red_herring_change
        params: {service: webhook-worker}
    noise:
      - type: benign_warnings

  - plan_id: PG-4
    domain: payment_gateway
    archetype: retry_policy_regression
    seed: 1004
    expected_outcome: identifiable
    params: {component: webhook-worker, target: merchant endpoints}
    noise:
      - type: benign_warnings
    tool_failures:
      - tool: get_change_history
        mode: partial
        params: {keep_fraction: 0.7}

  - plan_id: PG-5
    domain: payment_gateway
    archetype: certificate_expiry
    seed: 1005
    expected_outcome: inconclusive
    params: {component: bank-adapter, peer: upi-switch, not_after: "2026-10-31T00:00:00Z",
             rotation_change: true}
    decoys:
      - type: lookalike_history
        params:
          title: UPI failures during partner bank outage
          category: dependency_failure
          component: upi-switch
          resolution: waited for the bank to recover
    noise:
      - type: benign_warnings
    tool_failures:
      - tool: get_change_history
        mode: persistent
        params: {status: timeout}
    insufficiency:
      reason: >-
        The handshake errors that name the expired certificate were never logged, the
        handshake-failure metric was not collected, and the certificate rotation record
        cannot be fetched; only connection resets are visible.
      withhold: [logs, metric]
      unreachable: [change]
      alternatives:
        - {category: dependency_failure, component: upi-switch,
           why_plausible: "connection resets toward the bank look like a bank-side outage"}

