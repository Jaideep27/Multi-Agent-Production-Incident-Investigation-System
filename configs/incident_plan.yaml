  - plan_id: FD-3
    domain: food_delivery
    archetype: bad_release
    seed: 1403
    expected_outcome: inconclusive
    params: {component: dispatch-consumer, mode: consumer_bug, version: v2.4.0,
             previous_version: v2.3.9}
