  # ======================================================== story-driven evaluation set
  # Twelve multi-step production stories (the evaluation set): simple baselines, misleading
  # evidence, conflicting data, tool failures, an inconclusive case and deep dependency chains.

  # ---- simple baselines
  - plan_id: INC-01
    domain: online_retail
    archetype: bad_release
    seed: 1501
    expected_outcome: identifiable
    params: {component: checkout-api, mode: input_exception, version: v2.4.1,
             previous_version: v2.4.0}
    noise:
      - type: benign_warnings

  - plan_id: INC-02
    domain: online_retail
    archetype: session_cache_saturation
    seed: 1502
    expected_outcome: identifiable
    params: {component: session-cache, client: web-frontend, surge_factor: 4.0}
    noise:
      - type: benign_warnings

  - plan_id: INC-03
    domain: online_retail
    archetype: pool_size_regression
    seed: 1503
    expected_outcome: identifiable
    params:
      component: checkout-api
      dependency: orders-db
      setting: db.max_pool_size
      from_value: 100
      to_value: 10
    noise:
      - type: benign_warnings

  # ---- misleading evidence
  - plan_id: INC-04
    domain: online_retail
    archetype: certificate_expiry
    seed: 1504
    expected_outcome: identifiable
    params: {component: fraud-scoring-api, peer: payment-service, side: server,
             not_after: "2026-10-30T14:36:00Z"}
    decoys:
      - type: red_herring_change
        params:
          service: payment-service
          minutes_before: [1, 2]
          diff: {README.md: "updated setup notes", log_format: {from: text, to: json}}
    noise:
      - type: benign_warnings

  - plan_id: INC-05
    domain: search_platform
    archetype: feature_flag_regression
    seed: 1505
    expected_outcome: identifiable
    params: {component: query-parser, flag: fuzzy_synonyms, entry_latency_service: search-service,
             lookalike_service: elasticsearch}
    decoys:
      - type: lookalike_history
        params:
          title: Search p99 at 8 s caused by Elasticsearch GC pauses
          category: resource_exhaustion
          component: elasticsearch
          resolution: raised the JVM heap and tuned G1GC
          symptoms: ["search p99 latency above 8 s", "search timeouts", "elasticsearch GC pauses"]
    noise:
      - type: benign_warnings

  # ---- conflicting data
  - plan_id: INC-06
    domain: online_retail
    archetype: swallowed_error
    seed: 1506
    expected_outcome: identifiable
    params: {component: inventory-grpc, caller: catalog-graphql, version: v4.2.0,
             previous_version: v4.1.3}
    noise:
      - type: benign_warnings
      - type: conflicting_sources
        params: {service: catalog-graphql, metric: error_rate_pct, factor: 0.5}

  - plan_id: INC-07
    domain: saas_platform
    archetype: rate_limiter_retry_storm
    seed: 1507
    expected_outcome: identifiable
    params: {component: auth-service, clients: [user-profile, notification-worker]}
    decoys:
      - type: downstream_symptom
        params: {service: user-profile,
                 message: "auth-service call timed out after 2000ms; retrying (attempt 3/3)"}
      - type: downstream_symptom
        params: {service: notification-worker,
                 message: "user-profile call timed out after 2000ms; retrying (attempt 3/3)"}
    noise:
      - type: benign_warnings
      - type: clock_skew
        params: {service: user-profile, seconds: -240}

  # ---- complex story: delayed multi-hop chain
  - plan_id: INC-08
    domain: saas_platform
    archetype: schema_migration_backlog
    seed: 1508
    expected_outcome: identifiable
    params: {component: billing-service, worker: invoice-worker, queue: kafka-billing,
             version: v3.0.0, lead_minutes: 45}
    decoys:
      - type: red_herring_change
        params: {service: analytics-ingest, change_type: config_change, minutes_before: [2, 6]}
    noise:
      - type: benign_warnings

  # ---- tool failures
  - plan_id: INC-09
    domain: search_platform
    archetype: resource_saturation
    seed: 1509
    expected_outcome: identifiable
    params: {component: recommendation-engine, mode: memory_oom, limit: 2Gi}
    noise:
      - type: benign_warnings
    tool_failures:
      - tool: query_logs
        mode: transient
        params: {fail_first_n: 1, status: timeout}
      - tool: query_metrics
        mode: partial
        params: {keep_fraction: 0.5}

  - plan_id: INC-10
    domain: saas_platform
    archetype: io_saturation
    seed: 1510
    expected_outcome: identifiable
    params: {component: analytics-ingest}
    noise:
      - type: benign_warnings
    tool_failures:
      - tool: query_logs
        mode: persistent
        params: {status: error}

  # ---- inconclusive: evidence wiped, two changes at once
  - plan_id: INC-11
    domain: saas_platform
    archetype: crash_with_two_changes
    seed: 1511
    expected_outcome: inconclusive
    params: {component: media-transcoder, driver_from: "550.54", driver_to: "555.42"}
    decoys:
      - type: red_herring_change
        params:
          service: media-transcoder
          change_type: infra
          minutes_before: [0, 0]
          summary: media-transcoder base OS image update
          diff: {base_image: {from: ubuntu-22.04.4, to: ubuntu-24.04.1}}
    noise:
      - type: benign_warnings
    insufficiency:
      reason: >-
        The container's logs were wiped when it restarted and the crash-time GPU metrics were
        never scraped; a GPU driver upgrade and a base OS image update landed in the same
        minute, and nothing left distinguishes them.
      withhold: [logs, metric]
      alternatives:
        - {category: config_change, component: media-transcoder,
           why_plausible: "the base OS image changed in the same minute and could crash it too"}

  # ---- complex story: deep dependency chain
  - plan_id: INC-12
    domain: online_retail
    archetype: missing_client_timeout
    seed: 1512
    expected_outcome: identifiable
    params: {component: fulfillment-service, vendor: shipping-carrier}
    decoys:
      - type: red_herring_change
        params: {service: fulfillment-service, change_type: scaling, minutes_before: [12, 20]}
    noise:
      - type: benign_warnings
