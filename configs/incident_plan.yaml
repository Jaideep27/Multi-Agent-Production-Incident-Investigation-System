        params: {service: order-worker, message: "order still pending_payment after 600s"}
    noise:
      - type: benign_warnings
    tool_failures:
      - tool: query_logs
        mode: persistent
        params: {status: timeout}
      - tool: get_service_dependencies
        mode: persistent
        params: {status: error}
    insufficiency:
      reason: >-
        The callback rejection logs and throttling metrics were never collected, and the
        log and dependency tools fail for this incident, so the throttling is invisible.
      withhold: [logs, metric]
      alternatives:
        - {category: resource_exhaustion, component: order-worker,
           why_plausible: "orders pile up in the worker's pending state"}

