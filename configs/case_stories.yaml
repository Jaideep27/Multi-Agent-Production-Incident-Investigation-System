    misleading:
      - decoy_type: red_herring_change
        title: The operating system update
        why_tempting: The base image moved to a new Ubuntu version seconds before the driver upgrade, and it could plausibly crash a program.
        why_wrong: It could be the cause, and that is the point. Nothing in the remaining data rules it in or out.

      - title: The graphics driver upgrade
        why_tempting: The program depends on the graphics card, so a driver change feels like the natural culprit.
        why_wrong: It is a reasonable guess, but only a guess. Picking it with confidence would be claiming something the data can't show.

      - title: Harmless warnings in other services
        why_tempting: Warnings such as "GC pause of 742ms" look suspicious when something is broken.
        why_wrong: These 10 routine warnings are in other services and have no connection to the crash.

    clues:
      note: The two pieces of evidence that would have settled this are gone, which is why this case has no deciding clue. The container's logs were wiped when it restarted, and the graphics card metrics for the crash were never collected.

    answer:
      short: The right answer here is "inconclusive". Two changes landed together and nothing left in the data can separate them.
      paragraphs:
        - >-
          The test does have a hidden true cause, the driver upgrade, so that answers can be
          checked. But an investigator has no way of seeing it, because the crash logs and the
          graphics card readings don't exist.
        - >-
          This case tests honesty. Saying "the driver did it" happens to match the hidden cause,
          but nothing supports it, so it counts as wrong. The correct response is to name both
          candidates and say what is missing.
      category_note: Scored as correct only if the report says inconclusive. Committing to either change counts as wrong, even if it names the hidden cause.

    timeline:
      decoy_change: The operating system image is updated on media-transcoder.
      other_change: The graphics driver is upgraded on media-transcoder, 35 seconds later.
      users_hit: The program has crashed and restarted.
      reported: The platform on-call engineer reports the crash.
      data_ends: The data ends. The program is running again and the cause is still unknown.

    fixes:
      - "Now: keep both changes under watch, and be ready to roll them back."
      - "Next: roll them out separately on a test machine and see which one crashes."
      - "Later: keep crash logs outside the container, collect graphics card metrics, and never ship two risky changes at once."

    glossary:
      - term: Service
        meaning: One small program with one job. An app is many services calling each other.
      - term: Inconclusive
        meaning: The evidence can't separate the possible causes, so no cause is claimed.
      - term: Driver
        meaning: The software that lets programs use a piece of hardware.
      - term: Base image
        meaning: The operating system a container is built on.
      - term: Container
        meaning: A sealed box a program runs in. Its logs can vanish when it restarts.
      - term: UTC
        meaning: The world reference time. All the times on this page are in UTC.

  INC-12:
    domain: online_retail

    summary:
      company: Wrenfield Market is an online store. Customers browse products, fill a cart and place orders.
      problem: About 13 in every 100 orders failed, and fulfillment-service (the delivery program) kept restarting.
      false_lead: fulfillment-service was scaled up earlier, which looks suspicious. And shipping-carrier, the outside courier, got slow, which looks like the whole cause. The slow courier was only the trigger.
      cause: fulfillment-service calls the courier with no time limit, so it is willing to wait forever. That missing limit is the fault. When the courier slowed down, all its workers got stuck waiting.
      why_everyone: With every worker stuck, it couldn't even answer a health check, so it was restarted again and again, and orders needing delivery booking failed.
      fix: Set a time limit on fulfillment-service's calls to the courier.

    what_went_wrong:
      - >-
        Orders began failing and the share that worked fell from about 99% to about 87%. At the
        same time, the delivery program, fulfillment-service, kept restarting. The number of
        people shopping did not change. The storefront on-call engineer reported it about 12
        minutes after it began.

    impact:
      - service: web-frontend
        metric: order_success_rate_pct
        label: Orders that worked
        short: Orders that worked
      - service: fulfillment-service
        metric: upstream_latency_ms
        label: Time the courier takes to answer
        short: Time the courier takes to answer
      - service: edge-lb
        metric: requests_per_s
        label: Requests arriving per second

    misleading:
      - decoy_type: red_herring_change
        title: The delivery program was scaled up
        why_tempting: fulfillment-service went from 3 to 5 copies shortly before the trouble, and it is the only change in the hour.
        why_wrong: It happened 22 minutes before the first problem, and adding copies does not make calls hang. More copies would help, if anything.

      - title: The outside courier is to blame
        why_tempting: The courier really did slow down, from about 0.1 seconds to about 12 seconds.
        why_wrong: That is the trigger, but slow suppliers are normal. The store's own program had no time limit, which turned a slow courier into an outage. That is what the answer key blames.

      - title: A crash bug in the delivery program
        why_tempting: Constantly restarting usually means a program is crashing.
        why_wrong: It is not crashing. The restarts happen because it is too busy waiting to answer health checks, and its processor stays normal.
        checks:
          - service: fulfillment-service
            metric: cpu_pct
            label: fulfillment-service processor busy

      - title: Checkout looks like the problem
        why_tempting: checkout-api and web-frontend log dozens of timeouts.
        why_wrong: Those warnings all point onward to fulfillment-service. They are waiting in line behind it.

      - title: Harmless warnings in other services
        why_tempting: Warnings such as "GC pause of 790ms" look suspicious when something is broken.
        why_wrong: These 7 routine warnings are scattered across services, and some appeared before the trouble began.

    clues:
      log:
        title: A call to the courier has been hanging for two minutes
        meaning: The line says the call is still running after 119 seconds, and that no client timeout is configured. So nothing will ever make it give up.
      metric:
        title: All its workers are busy
        meaning: Busy threads shows the share of workers occupied. It went from about 20% to 100%. With no free worker, nothing else can be done, including answering a health check.

    answer:
      short: fulfillment-service calls shipping-carrier with no time limit, so when the courier slowed down, every worker got stuck and the service kept being restarted.
      paragraphs:
        - >-
          fulfillment-service has 200 workers, each handling one job. The courier slowed from
          about 0.1 seconds to about 12 seconds. With no client timeout, each worker simply
          waited, until all 200 were stuck.
        - >-
          Kubernetes checks each program by asking "are you alive?". With no free worker to
          answer, the check failed and the program was restarted. It then filled up again, in a
          loop. Orders that needed delivery booked timed out on the way back to the customer.
      category_note: Scored as a dependency failure on fulfillment-service, because how it handles a slow dependency is the store's own defect. It's a judgement call, since the courier is the trigger.

    timeline:
      decoy_change: fulfillment-service is scaled from 3 to 5 copies. Nothing goes wrong.
      first_sign: fulfillment-service logs a courier call still hanging after two minutes.
      users_hit: The share of orders that work falls to about 87%.
      first_error: Its health check fails, and the system starts restarting it.
      reported: The storefront on-call engineer reports failing fulfilment.
      data_ends: The data ends. The courier is still slow and the program is still restarting.

    fixes:
      - "Now: set a time limit on calls to shipping-carrier."
      - "Next: make the health check independent of the busy workers."
      - "Later: stop calling a slow supplier for a while when it degrades, and queue delivery bookings instead of waiting."

    glossary:
      - term: Service
        meaning: One small program with one job. A website is many services calling each other.
      - term: Client timeout
        meaning: A limit on how long a program will wait for an answer.
      - term: Thread pool
        meaning: A fixed set of workers that handle jobs.
      - term: Liveness probe
        meaning: A regular "are you alive?" check. Fail it and the program is restarted.
      - term: Kubernetes
        meaning: The system that runs programs and restarts them when needed.
      - term: Replica
        meaning: One running copy of a program.
      - term: UTC
        meaning: The world reference time. All the times on this page are in UTC.
